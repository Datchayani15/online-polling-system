<!DOCTYPE html>
<html>
<head>
    <title>Poll Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Segoe+UI:400,600&display=swap');
        body {
            background: linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            padding: 32px 32px 24px 32px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(52, 152, 219, 0.13), 0 1.5px 8px rgba(44, 62, 80, 0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 26px;
            color: #057af7;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .result-bar {
            background: #e0eafc;
            border-radius: 6px;
            margin-bottom: 14px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 1px 4px rgba(52,152,219,0.06);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #7af508; /* Added text color */
        }
        .result-bar span {
            color: #34495e; /* Added text color for option text */
        }
        .votes {
            color: #3498db;
            font-weight: 600;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        a {
            display: block;
            margin: 22px auto 0 auto;
            text-align: center;
            color: #3498db;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        a:hover {
            text-decoration: underline;
            color: #217dbb;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Results: {{ poll.title }}</h2>
    {% for text, count in results %}
        <div class="result-bar">
            <span>{{ text }}</span>
            <span class="votes">{{ count }} votes</span>
        </div>
    {% endfor %}
    <a href="/dashboard">← Back to
